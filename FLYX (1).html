<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLYX</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06010d;--line:#6d28d9;--glow:#a855f7;--soft:#d8b4fe;--txt:#f3e8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora{background:radial-gradient(60% 40% at 20% 10%,rgba(124,58,237,.55),transparent 70%),radial-gradient(50% 40% at 85% 45%,rgba(168,85,247,.4),transparent 70%),radial-gradient(60% 45% at 30% 100%,rgba(88,28,200,.55),transparent 70%);background-size:140% 140%;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{background-position:100% 100%;filter:hue-rotate(-18deg)}}
.grid{inset:auto 0 0 0;height:45%;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 38px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/38px 100%;opacity:.35;transform:perspective(300px) rotateX(60deg);transform-origin:bottom;animation:grid 1.4s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
@keyframes grid{to{background-position:0 38px,38px 0}}
.scan{background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.28) 3px 4px);mix-blend-mode:multiply}
.vig{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75))}
.orb{position:absolute;border-radius:50%;filter:blur(30px);background:radial-gradient(circle,rgba(192,132,252,.7),transparent 70%);animation:float 9s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(40px,-60px) scale(1.3)}}
.fall,.rise{position:absolute;will-change:transform;user-select:none}
.fall{top:-12%;font-family:'Permanent Marker',cursive;color:var(--glow);animation:fall linear infinite}
.rise{bottom:-10%;color:var(--soft);text-shadow:0 0 10px var(--glow);animation:rise linear infinite}
@keyframes fall{to{transform:translateY(125vh)}}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
main{position:relative;z-index:1;min-height:100dvh;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;gap:16px;padding:0 0 26px}
.hero{position:relative;margin-bottom:50px}
.bwrap{position:relative;overflow:hidden;border-bottom:2px solid var(--line);box-shadow:0 8px 34px rgba(168,85,247,.55)}
.banner{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;transform-origin:30% 50%;animation:ken 12s ease-in-out infinite alternate}
@keyframes ken{to{transform:scale(1.14) translate(-2%,1%);filter:saturate(1.35) hue-rotate(-10deg)}}
.gl{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 14px,rgba(192,132,252,.2) 14px 16px);mix-blend-mode:screen;animation:bscan 4s linear infinite,gflick 6s steps(1) infinite}
@keyframes bscan{to{background-position:0 64px}}
@keyframes gflick{0%,92%,100%{transform:none}94%{transform:translateX(8px)}96%{transform:translateX(-8px)}}
.sw{position:absolute;top:0;left:-50%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:swp 5s ease-in-out infinite}
@keyframes swp{0%,60%{left:-50%}100%{left:130%}}
.avatar{position:absolute;left:50%;bottom:-50px;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;object-fit:cover;background:#000;border:3px solid var(--glow);z-index:1;animation:pulse 2.4s ease-in-out infinite,bob 3s ease-in-out infinite,flick 6s infinite}
.ring{position:absolute;left:50%;bottom:-58px;width:116px;height:116px;border-radius:50%;z-index:0;translate:-50% 0;background:conic-gradient(#a855f7,transparent 30%,#e9d5ff 55%,transparent 80%,#a855f7);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:rot 3s linear infinite,bob2 3s ease-in-out infinite}
@keyframes bob{50%{translate:0 -8px}}
@keyframes bob2{50%{translate:-50% -8px}}
@keyframes rot{to{rotate:360deg}}
@keyframes flick{0%,92%,100%{filter:none}94%{filter:hue-rotate(40deg) brightness(1.4)}96%{filter:brightness(1.8) saturate(1.5)}}
@keyframes pulse{50%{box-shadow:0 0 34px 6px var(--glow)}0%,100%{box-shadow:0 0 14px var(--glow)}}
h1{margin:0;text-align:center;font:2.9rem 'Permanent Marker',cursive;letter-spacing:.08em;color:var(--soft);text-shadow:0 0 18px var(--glow);position:relative;animation:glitch 3s infinite}
@keyframes glitch{0%,90%,100%{transform:none;text-shadow:0 0 18px var(--glow)}92%{transform:translate(-3px,1px);text-shadow:3px 0 #f0f,-3px 0 #0ff}95%{transform:translate(3px,-1px);text-shadow:-3px 0 #f0f,3px 0 #0ff}}
.tag{margin:-8px 0 0;text-align:center;font-size:.8rem;letter-spacing:.3em;color:var(--soft);opacity:.85}
.box{position:relative;margin:0 16px;padding:16px;border-radius:16px;background:rgba(14,4,30,.85);backdrop-filter:blur(5px);isolation:isolate}
.box::before{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:18px;background:conic-gradient(from var(--a,0deg),#7c3aed,#000,#c084fc,#000,#7c3aed);animation:spin 4s linear infinite}
.box::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:16px;background:#0d031c}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.box h2{margin:0 0 10px;font-size:1.05rem;letter-spacing:.12em;color:var(--soft)}
textarea{display:block;width:100%;height:92px;resize:none;padding:12px;border-radius:10px;border:1.5px solid #3b1a73;background:#05010c;color:var(--txt);font:600 .72rem/1.4 ui-monospace,Menlo,monospace}
textarea:focus-visible,.btn:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font:800 1rem 'Nunito',sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 0 18px rgba(168,85,247,.65);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.btn:active{transform:scale(.97)}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 0 18px rgba(34,197,94,.6)}
.btn.dark{background:#1a0a33;border:1.5px solid var(--glow)}
.social{text-align:center}
.social svg{width:56px;height:56px;filter:drop-shadow(0 0 10px var(--glow));animation:pulse2 2s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.12) rotate(-4deg)}}
.sp{position:fixed;z-index:5;pointer-events:none;color:var(--soft);text-shadow:0 0 8px var(--glow);animation:pop .8s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.2) rotate(180deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.fall{top:var(--t)}.rise{bottom:var(--t)}}
</style></head><body>

<h2>OTIMIZAÇÃO FLYX</h2>
<textarea id="t1" readonly aria-label="Otimização FLYX">-- Made by FLYX_333
-- Discord: https://discord.gg/5wrt6jBun7

local Lighting = game:GetService("Lighting")
local Workspace = game:GetService("Workspace")
local Players = game:GetService("Players")
local TweenService = game:GetService("TweenService")
local GRAY = Color3.fromRGB(128, 128, 128)

local CFG = {
    CinzaLiso = true,           -- tudo liso e cinza
    ReduzirBrilho = true,       -- tira Neon, luzes, Bloom, SunRays
    ReduzirEfeitos = true,      -- desliga partículas, trails e beams
    CongelarAnimOutros = false, -- para animações de outros jogadores
    EsconderOutros = true,      -- deixa outros jogadores invisíveis
    FPSCap = 120,               -- limite de FPS (0 para não mexer)
}

-- Mensagem na tela
task.spawn(function()
    local ok, parent = pcall(function()
        return (gethui and gethui()) or game:GetService("CoreGui")
    end)
    if not ok or not parent then
        parent = Players.LocalPlayer:WaitForChild("PlayerGui")
    end

    local gui = Instance.new("ScreenGui")
    gui.Name = "FLYXAviso"
    gui.ResetOnSpawn = false
    gui.IgnoreGuiInset = true
    gui.Parent = parent

    local frame = Instance.new("Frame")
    frame.AnchorPoint = Vector2.new(0.5, 0)
    frame.Position = UDim2.new(0.5, 0, 0, -60)
    frame.Size = UDim2.new(0, 260, 0, 44)
    frame.BackgroundColor3 = Color3.fromRGB(15, 0, 25)
    frame.BorderSizePixel = 0
    frame.Parent = gui

    Instance.new("UICorner", frame).CornerRadius = UDim.new(0, 10)
    local stroke = Instance.new("UIStroke", frame)
    stroke.Color = Color3.fromRGB(150, 60, 255)
    stroke.Thickness = 2

    local label = Instance.new("TextLabel")
    label.Size = UDim2.new(1, 0, 1, 0)
    label.BackgroundTransparency = 1
    label.Text = "feito por @flyx_333"
    label.TextColor3 = Color3.fromRGB(190, 120, 255)
    label.Font = Enum.Font.GothamBold
    label.TextSize = 18
    label.Parent = frame

    local info = TweenInfo.new(0.5, Enum.EasingStyle.Quad)
    TweenService:Create(frame, info, {Position = UDim2.new(0.5, 0, 0, 20)}):Play()
    task.wait(4)
    TweenService:Create(frame, info, {Position = UDim2.new(0.5, 0, 0, -60)}):Play()
    task.wait(0.6)
    gui:Destroy()
end)

local function clean(v)
    if v:IsA("BasePart") then
        if CFG.CinzaLiso then
            v.Material = Enum.Material.SmoothPlastic
            v.Color = GRAY
            v.Reflectance = 0
            v.CastShadow = false
            if v:IsA("MeshPart") then
                v.TextureID = ""
                pcall(function() v.RenderFidelity = Enum.RenderFidelity.Performance end)
            end
        elseif CFG.ReduzirBrilho and v.Material == Enum.Material.Neon then
            v.Material = Enum.Material.SmoothPlastic
        end
    elseif v:IsA("SpecialMesh") then
        if CFG.CinzaLiso then v.TextureId = "" end
    elseif v:IsA("Decal") or v:IsA("Texture") or v:IsA("SurfaceAppearance")
        or v:IsA("Shirt") or v:IsA("Pants") or v:IsA("ShirtGraphic") then
        if CFG.CinzaLiso then v:Destroy() end
    elseif v:IsA("Light") then
        if CFG.ReduzirBrilho then v.Enabled = false end
    elseif v:IsA("ParticleEmitter") or v:IsA("Trail") or v:IsA("Smoke")
        or v:IsA("Fire") or v:IsA("Sparkles") or v:IsA("Beam") then
        if CFG.ReduzirEfeitos then v.Enabled = false end
    elseif v:IsA("PostEffect") then
        if CFG.ReduzirBrilho then v.Enabled = false end
    elseif v:IsA("Atmosphere") then
        v:Destroy()
    elseif v:IsA("Explosion") then
        v.Visible = false
    end
end

-- Lighting / gráficos
pcall(function()
    Lighting.GlobalShadows = false
    Lighting.FogEnd = 9e9
    if CFG.CinzaLiso then
        Lighting.Brightness = 2
        Lighting.Ambient = GRAY
        Lighting.OutdoorAmbient = GRAY
    end
    settings().Rendering.QualityLevel = Enum.QualityLevel.Level01
end)

-- Extras de FPS
pcall(function()
    if setfpscap and CFG.FPSCap &gt; 0 then setfpscap(CFG.FPSCap) end
end)
pcall(function()
    sethiddenproperty(Lighting, "Technology", Enum.Technology.Compatibility)
end)
pcall(function()
    settings().Rendering.MeshPartDetailLevel = Enum.MeshPartDetailLevel.Level04
end)
pcall(function()
    settings().Rendering.EagerBulkExecution = true
end)

-- Terreno e água
pcall(function()
    local t = Workspace.Terrain
    t.WaterWaveSize = 0
    t.WaterWaveSpeed = 0
    t.WaterReflectance = 0
    t.WaterTransparency = 0
    t.Decoration = false
end)

for _, v in ipairs(Lighting:GetDescendants()) do clean(v) end
Lighting.DescendantAdded:Connect(function(v) task.defer(clean, v) end)

-- Aplica em tudo (em lotes pra não travar)
local n = 0
for _, v in ipairs(Workspace:GetDescendants()) do
    clean(v)
    n += 1
    if n % 500 == 0 then task.wait() end
end
